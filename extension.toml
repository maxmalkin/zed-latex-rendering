id = "latex-rendering-lsp"
name = "ZedTeX"
version = "0.1.5"
schema_version = 1
authors = ["Max Malkin <max@malkin.io>"]
description = "Package-aware TeX page previews, Markdown math images, and notebook HTML/PDF exports through code actions."
repository = "https://github.com/maxmalkin/zedtex"
snippets = ["./snippets/python.json", "./snippets/latex.json"]

[language_servers.latex-rendering]
name = "ZedTeX"
languages = ["LaTeX", "Markdown", "Python", "JSON", "Jupyter Notebook"]

[language_servers.latex-rendering.language_ids]
"Jupyter Notebook" = "json"
