name: Renderer bundles
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x86_64
            tectonic: x86_64-pc-windows-msvc.zip
          - runner: ubuntu-22.04
            platform: linux-x86_64
            tectonic: x86_64-unknown-linux-musl.tar.gz
          - runner: macos-15
            platform: macos-aarch64
            tectonic: aarch64-apple-darwin.tar.gz
          - runner: macos-15-intel
            platform: macos-x86_64
            tectonic: x86_64-apple-darwin.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --no-cache-dir . pyinstaller
      - name: Check image transport and language-server regressions
        run: python -m unittest -v test_regressions
      - name: Package native server
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --name latex-rendering
          --collect-all nbconvert --collect-all nbformat --collect-all mistune
          --collect-all pygls --collect-all jupytext --collect-all pypdfium2
          --collect-all playwright --collect-all pygments
          --exclude-module jedi --exclude-module ipykernel --exclude-module tkinter
          --copy-metadata nbconvert --copy-metadata jupytext --copy-metadata jupyter_client
          --collect-data jupyterlab_pygments zed_latex.py
      - name: Download Tectonic and package release
        env:
          TECTONIC_TARGET: ${{ matrix.tectonic }}
          BUNDLE_PLATFORM: ${{ matrix.platform }}
        run: python package_bundle.py
      - name: Register test computation kernel
        run: |
          python -m ipykernel install --user --name zedtex-test
          python -m ipykernel install --user --name python3
      - name: Check real rendering, incremental rebuilds, and notebook execution
        timeout-minutes: 15
        env:
          ZED_LATEX_TECTONIC: ${{ github.workspace }}/dist/latex-rendering/tectonic${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python check.py
      - name: Test packaged renderer
        timeout-minutes: 15
        run: python check_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: latex-rendering-${{ matrix.platform }}
          path: dist/*.zip
          retention-days: 3
  publish:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish verified bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create backend-v0.1.4 release/*.zip
          --target "$GITHUB_SHA"
          --title "Renderer backend 0.1.4"
          --notes "Smaller bundles reuse Zed's shared Node runtime and exclude unused Jedi, ipykernel, and Tk components. Browser downloads are shared across renderer updates. Includes 50 regression tests plus real rendering, fresh notebook execution, and frozen LSP preview/export checks on all four targets. Standalone PDF export requires Node.js 20+ on PATH or PLAYWRIGHT_NODEJS_PATH. Registry publication is separate."
